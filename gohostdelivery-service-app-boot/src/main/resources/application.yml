spring:
  application:
    name: gohostdelivery-service
  profiles:
    active: local
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  kafka:
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: gohostdelivery-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

kafka:
  topics:
    order-created: order-created

server:
  port: 8080

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    path: /swagger-ui.html
    url: /openapi.yml

pizzagest:
  url: ${PIZZAGEST_URL:https://tiendaonline4.pizzagest.info/PAV_JWT/}
  user: ${PIZZAGEST_USER:34003655}
  pass: ${PIZZAGEST_PASS:}
  client-code: ${PIZZAGEST_CLIENT_CODE:10}
  hub-code: ${PIZZAGEST_HUB_CODE:4}
  default-company-id: ${PIZZAGEST_DEFAULT_COMPANY_ID:}
  scheduler:
    enabled: ${PIZZAGEST_SCHEDULER_ENABLED:true}
