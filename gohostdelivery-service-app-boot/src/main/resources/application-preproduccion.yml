spring:
  config:
    activate:
      on-profile: preproduccion
  datasource:
    # Cloud SQL Socket Factory: no necesita SSL manual ni IPs abiertas
    # CLOUD_SQL_CONNECTION_NAME formato: PROJECT_ID:REGION:gohost-bd-pre
    url: jdbc:postgresql:///postgres?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    stream:
      defaultBinder: pubsub
      bindings:
        order-created-out-0:
          destination: order-created        # Nombre del topic en Cloud Pub/Sub
          content-type: application/json
    gcp:
      pubsub:
        project-id: ${GOOGLE_CLOUD_PROJECT:project-1f43bc6d-114e-44c8-bf4}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      retries: 1
    listener:
      missing-topics-fatal: false

logging:
  level:
    com.zms.gohostdeliveryservice: INFO
    org.springframework.cloud.stream: INFO
    org.springframework.kafka: WARN
