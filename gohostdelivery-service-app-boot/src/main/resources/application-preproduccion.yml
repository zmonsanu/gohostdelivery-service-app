spring:
  config:
    activate:
      on-profile: preproduccion
  datasource:
    # Cloud SQL Socket Factory: no necesita SSL manual ni IPs abiertas
    # CLOUD_SQL_CONNECTION_NAME formato: PROJECT_ID:REGION:gohost-bd-pre
    url: jdbc:postgresql:///postgres?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

logging:
  level:
    com.zms.gohostdeliveryservice: INFO
    org.springframework.kafka: WARN
