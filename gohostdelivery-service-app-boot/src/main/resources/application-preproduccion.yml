spring:
  config:
    activate:
      on-profile: preproduccion
  datasource:
    # Cloud SQL Socket Factory: no necesita SSL manual ni IPs abiertas
    # CLOUD_SQL_CONNECTION_NAME formato: PROJECT_ID:REGION:gohost-bd-pre
    url: jdbc:postgresql:///postgres?cloudSqlInstance=${CLOUD_SQL_CONNECTION_NAME}&socketFactory=com.google.cloud.sql.postgres.SocketFactory
    username: ${DB_USER:gohost}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  cloud:
    stream:
      defaultBinder: pubsub
      bindings:
        order-created-out-0:
          destination: order-created        # Topic de salida
          content-type: application/json
        orderCreatedConsumer-in-0:
          destination: order-created        # Topic de entrada (mismo topic para encolar)
          group: notification-service       # Subscription en GCP Pub/Sub
          content-type: application/json
    gcp:
      sql:
        enabled: false
      pubsub:
        # Spring Cloud GCP detectará el PROJECT_ID automáticamente en Cloud Run
  
  # Habilitamos Firebase para notificaciones push en preproducción
  gohost:
    fcm:
      enabled: true
      project-id: gohostdelivery-c060e

logging:
  level:
    com.zms.gohostdeliveryservice: INFO
    org.springframework.cloud.stream: INFO
    org.springframework.kafka: WARN
